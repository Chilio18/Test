version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: revenue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: revenue_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: revenue-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MinIO (S3-compatible storage) ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: revenue-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── Seq (structured logging) ────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: revenue-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  # ─── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenue-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=revenue_intelligence;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-redis}"
      Auth__Authority: ${AUTH_AUTHORITY}
      Auth__Audience: ${AUTH_AUDIENCE:-revenue-intelligence-api}
      AI__Provider: ${AI_PROVIDER:-Mock}
      AI__OpenAI__ApiKey: ${OPENAI_API_KEY}
      AI__Anthropic__ApiKey: ${ANTHROPIC_API_KEY}
      Storage__S3__ServiceUrl: "http://minio:9000"
      Storage__S3__BucketName: ${S3_BUCKET:-revenue-intelligence}
      Storage__S3__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      Storage__S3__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      Encryption__Key: ${ENCRYPTION_KEY}
      Seq__Url: "http://seq:80"
      Cors__Origins__0: "http://localhost:3000"
      Cors__Origins__1: ${FRONTEND_URL:-https://app.unameit.nl}
    ports:
      - "5000:8080"

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: revenue-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://api:8080}
      NUXT_PUBLIC_SIGNALR_BASE: ${NUXT_PUBLIC_SIGNALR_BASE:-http://api:8080}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  seq_data:

networks:
  default:
    name: revenue-intelligence
